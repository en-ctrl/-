<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>種菜小幫手</title><style>
:root{--g:#6f9272;--bg:#faf7ee;--card:#fffdf7;--ink:#29372f;--muted:#66736b;--line:#e3e3d9}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);font-size:20px;line-height:1.55}header{padding:24px 18px 10px;max-width:900px;margin:auto}h1{margin:0;font-size:34px}h2{font-size:27px;margin:4px 0 14px}.sub{color:var(--muted);font-size:18px}.wrap{max-width:900px;margin:auto;padding:10px 18px 105px}.grid{display:grid;gap:16px}.card,.box{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 6px 24px #526b5712}.crop,.record{padding:16px 0;border-bottom:1px solid var(--line)}.crop{display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer}.crop:last-child,.record:last-child{border:0}.badge{background:#e8f0e7;color:#4f6853;padding:8px 12px;border-radius:999px;font-weight:800;white-space:nowrap}.calhead{display:flex;justify-content:space-between;align-items:center}.calhead button,.tabs button,.actions button{border:0;padding:12px 16px;border-radius:12px;font-size:19px}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.week{margin-top:14px;color:var(--muted);font-size:17px}.day{min-height:58px;padding:8px 3px;border-radius:12px;cursor:pointer;position:relative;font-size:18px}.day:hover,.day.sel{background:#eaf0e7}.dot{width:8px;height:8px;border-radius:50%;background:var(--g);position:absolute;bottom:5px;left:50%;transform:translateX(-50%)}#daily{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.fab{position:fixed;right:24px;bottom:105px;width:70px;height:70px;border:0;border-radius:50%;background:var(--g);color:white;font-size:40px;box-shadow:0 8px 22px #45604b55;cursor:pointer}.bottomnav{position:fixed;left:0;right:0;bottom:0;height:88px;background:#fffdf7;border-top:1px solid #e2e5dc;display:grid;grid-template-columns:1fr 1fr;z-index:20;box-shadow:0 -6px 20px #526b5712}.bottomnav button{border:0;background:transparent;font-size:20px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center}.bottomnav button.active{color:var(--g);background:#f0f4ec}.bottomnav .ico{font-size:29px}.field{margin:18px 0}.field label{display:block;margin-bottom:8px;font-weight:800;font-size:20px}.field input,.field textarea{width:100%;padding:14px;border:2px solid #d8d9d1;border-radius:12px;background:white;font-size:20px}.suggest{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}.suggest button{border:1px solid #cdd8ca;background:#f1f5ed;color:#405744;border-radius:999px;padding:9px 14px;font-size:18px;cursor:pointer}.daysPreview{margin-top:8px;font-weight:800;color:#56715a}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.actions button{font-weight:800}.primary,.complete{background:var(--g);color:white}.complete{border:0;border-radius:13px;padding:14px 18px;font-size:20px;font-weight:800;width:100%;margin-top:18px}.tabs{display:flex;gap:8px}.tabs button.active{background:var(--g);color:#fff}.hidden{display:none}.record{cursor:pointer}.record img,.detail img{max-width:100%;max-height:360px;border-radius:14px;margin-top:10px}.back{border:0;background:#edf2ea;border-radius:12px;padding:11px 15px;font-size:19px;margin-bottom:14px}.status{display:inline-block;padding:7px 11px;border-radius:999px;background:#e8f0e7;font-weight:800}.done{background:#ecebea;color:#62645f}.searchbox{width:100%;padding:14px;border:2px solid #ddd;border-radius:12px;font-size:20px;margin-bottom:12px}@media(max-width:560px){body{font-size:19px}h1{font-size:31px}.day{min-height:52px;font-size:17px}.wrap{padding-left:14px;padding-right:14px}.card,.box{padding:17px}.crop{align-items:flex-start;flex-direction:column}.badge{align-self:flex-start}}
</style></head><body><header><h1>🌱 種菜小幫手</h1><div class="sub" id="today"></div></header><main class="wrap">
<section id="home" class="grid"><div class="card"><h2>🌿 作物倒數日</h2><div id="countdowns"></div></div><div class="card"><div class="calhead"><button onclick="moveMonth(-1)">‹</button><h2 id="monthTitle"></h2><button onclick="moveMonth(1)">›</button></div><div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="calendar" id="calendar"></div><div id="daily">請點選日期查看紀錄 🌱</div></div></section>
<section id="add" class="hidden"><form class="box" id="form"><button type="button" class="back" onclick="showPage('home')">‹ 返回首頁</button><h2>＋ 新增種植紀錄</h2><div class="field"><label>作物名稱 *</label><input id="crop" required placeholder="例如：白菜"><div class="suggest"><button type="button" onclick="pickCrop('白菜')">白菜</button><button type="button" onclick="pickCrop('高麗菜')">高麗菜</button><button type="button" onclick="pickCrop('小白菜')">小白菜</button><button type="button" onclick="pickCrop('番茄')">番茄</button><button type="button" onclick="pickCrop('蘿蔔')">蘿蔔</button><button type="button" onclick="pickCrop('萵苣')">萵苣</button><button type="button" onclick="pickCrop('青江菜')">青江菜</button><button type="button" onclick="pickCrop('蔥')">蔥</button></div></div><div class="field"><label>種植日期 *</label><input id="planted" type="date" required></div><div class="field"><label>預計採收日期 *</label><input id="target" type="date" required oninput="updateDays()"><div id="daysPreview" class="daysPreview">選擇預計採收日期後會自動計算倒數天數</div></div><div class="field"><label>備註（選填）</label><textarea id="note" rows="4" placeholder="可以記錄種植情況、施肥等"></textarea></div><div class="field"><label>📷 圖片（選填）</label><input id="photo" type="file" accept="image/*"></div><div class="actions"><button type="button" onclick="showPage('home')">取消</button><button class="primary">儲存</button></div></form></section>
<section id="search" class="hidden"><div class="card"><h2>🔎 查詢紀錄</h2><input id="q" class="searchbox" placeholder="搜尋作物名稱" oninput="renderSearch()"><div class="sub" style="margin-bottom:10px">搜尋結果會同時顯示所有作物，並標示「未完成／已完成」。</div><div id="results"></div></div></section>
<section id="detail" class="hidden"><div class="card detail"><button class="back" onclick="goBack()">‹ 返回</button><div id="detailContent"></div></div></section>
</main><button class="fab" id="fab" onclick="showPage('add')">＋</button><nav class="bottomnav" id="bottomnav"><button id="navHome" class="active" onclick="showPage('home')"><span class="ico">🏠</span><span>首頁</span></button><button id="navSearch" onclick="showPage('search')"><span class="ico">🔎</span><span>查詢</span></button></nav><script>
const key='plantHelperRecords';let records=JSON.parse(localStorage.getItem(key)||'[]').map(r=>({...r,completed:!!r.completed,completedAt:r.completedAt||''})),view=new Date(),selected=null,lastPage='home';const pad=n=>String(n).padStart(2,'0');const day0=s=>new Date(s+'T00:00:00');const diff=s=>Math.ceil((day0(s)-new Date(new Date().toDateString()))/86400000);function save(){localStorage.setItem(key,JSON.stringify(records))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function init(){let d=new Date();planted.value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;today.textContent=`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日・星期${'日一二三四五六'[d.getDay()]}`;render()}function render(){renderCountdown();renderCal();renderSearch()}function remainText(r){let n=diff(r.target);return n===0?'今天':n>0?`${n} 天後`:`已超過 ${Math.abs(n)} 天`}function renderCountdown(){let a=records.filter(r=>!r.completed).sort((a,b)=>diff(a.target)-diff(b.target));countdowns.innerHTML=a.length?a.map(r=>`<div class="crop" onclick="openDetail(${r.id},'home')"><div><b>🌱 ${esc(r.crop)}</b><div class="sub">目標日期：${r.target}</div></div><span class="badge">${remainText(r)}</span></div>`).join(''):'目前沒有進行中的作物 🌱'}function renderCal(){let y=view.getFullYear(),m=view.getMonth();monthTitle.textContent=`${y} 年 ${m+1} 月`;let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),h='';for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=days;d++){let s=`${y}-${pad(m+1)}-${pad(d)}`,has=records.some(r=>r.target===s);h+=`<div class="day ${selected===s?'sel':''}" onclick="selectDay('${s}')">${d}${has?'<span class="dot"></span>':''}</div>`}calendar.innerHTML=h;if(selected)showDaily()}function moveMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);selected=null;daily.textContent='請點選日期查看紀錄 🌱';renderCal()}function selectDay(s){selected=s;renderCal()}function showDaily(){let a=records.filter(r=>r.target===selected);daily.innerHTML=`<b>📅 ${selected} 當日紀錄</b>`+(a.length?a.map(r=>recordCard(r,'home')).join(''):'<div class="sub" style="margin-top:8px">這天沒有種植紀錄 🌱</div>')}function recordCard(r,from){return `<div class="record" onclick="openDetail(${r.id},'${from}')"><b>🌱 ${esc(r.crop)}</b> <span class="status ${r.completed?'done':''}">${r.completed?'已完成':'未完成'}</span><div>種植日期：${r.planted||'—'}｜預計採收：${r.target}｜${r.completed?'已完成':remainText(r)}</div>${r.note?`<div>備註：${esc(r.note)}</div>`:''}</div>`}function renderSearch(){if(!results)return;let term=(q.value||'').toLowerCase(),a=records.filter(r=>r.crop.toLowerCase().includes(term));results.innerHTML=a.length?a.sort((a,b)=>Number(a.completed)-Number(b.completed)||a.target.localeCompare(b.target)).map(r=>recordCard(r,'search')).join(''):'<p class="sub">沒有符合的紀錄。</p>'}function openDetail(id,from){lastPage=from||'home';let r=records.find(x=>x.id===id);if(!r)return;detailContent.innerHTML=`<h2>🌱 ${esc(r.crop)}</h2><p><span class="status ${r.completed?'done':''}">${r.completed?'已完成':'未完成'}</span></p><p><b>種植日期：</b>${r.planted||'—'}</p><p><b>預計採收日期：</b>${r.target}</p><p><b>倒數：</b>${r.completed?'已完成':remainText(r)}</p>${r.note?`<p><b>備註：</b>${esc(r.note)}</p>`:'<p><b>備註：</b>無</p>'}${r.photo?`<p><b>圖片：</b><br><img src="${r.photo}"></p>`:''}${r.completed?`<p><b>完成日期：</b>${r.completedAt||'—'}</p><button class="complete" onclick="markIncomplete(${r.id})">↩ 標示為未完成</button>`:`<button class="complete" onclick="markComplete(${r.id})">✓ 標記已完成</button>`}`;showPage('detail')}function markComplete(id){let r=records.find(x=>x.id===id);if(!r)return;if(confirm(`確定要將「${r.crop}」標記為已完成嗎？`)){r.completed=true;r.completedAt=new Date().toLocaleDateString('zh-TW');save();render();openDetail(id,lastPage)}}function markIncomplete(id){let r=records.find(x=>x.id===id);if(!r)return;if(confirm(`確定要將「${r.crop}」恢復為未完成嗎？`)){r.completed=false;r.completedAt='';save();render();openDetail(id,lastPage)}}function goBack(){showPage(lastPage)}function showPage(id){['home','add','search','detail'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));navHome.classList.toggle('active',id==='home'||id==='add'||(id==='detail'&&lastPage==='home'));navSearch.classList.toggle('active',id==='search'||(id==='detail'&&lastPage==='search'));fab.classList.toggle('hidden',id!=='home');bottomnav.classList.toggle('hidden',id==='add'||id==='detail');if(id==='search')renderSearch();window.scrollTo({top:0,behavior:'smooth'})}function pickCrop(name){crop.value=name;crop.focus()}function updateDays(){if(!target.value){daysPreview.textContent='選擇日期後會自動計算倒數天數';return}let n=diff(target.value);daysPreview.textContent=n===0?'目標日期就是今天':n>0?`距離目標日期還有 ${n} 天`:`目標日期已過 ${Math.abs(n)} 天（仍會保持進行中，直到你按「已完成」）`}form.onsubmit=e=>{e.preventDefault();let f=photo.files[0];let add=p=>{records.push({id:Date.now(),crop:crop.value.trim(),planted:planted.value,target:target.value,note:note.value.trim(),photo:p||'',completed:false,completedAt:''});save();form.reset();let d=new Date();planted.value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;updateDays();render();showPage('home')};if(f){let rd=new FileReader();rd.onload=()=>add(rd.result);rd.readAsDataURL(f)}else add('')};init();
</script></body></html>
