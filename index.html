<!doctype html><html lang='zh-Hant'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>種菜小幫手</title><style>
:root{--g:#78977a;--bg:#faf7ee;--card:#fffdf7;--ink:#33413a;--muted:#718078}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink)}header{padding:24px 18px 10px;max-width:900px;margin:auto}h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:6px}.wrap{max-width:900px;margin:auto;padding:10px 18px 90px}.grid{display:grid;gap:14px}.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 6px 24px #526b5712}.crop{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e9e6dc}.crop:last-child{border:0}.badge{background:#e8f0e7;color:#58705b;padding:6px 10px;border-radius:999px;font-weight:700}.calhead{display:flex;justify-content:space-between;align-items:center}.calhead button,.tabs button{border:0;background:#edf2ea;padding:8px 12px;border-radius:10px;color:var(--ink)}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.week{margin-top:14px;color:var(--muted);font-size:13px}.day{min-height:52px;padding:7px 3px;border-radius:10px;cursor:pointer;position:relative}.day:hover,.day.sel{background:#eaf0e7}.dot{width:6px;height:6px;border-radius:50%;background:var(--g);position:absolute;bottom:5px;left:50%;transform:translateX(-50%)}#daily{margin-top:12px;padding-top:12px;border-top:1px solid #ebe8df}.fab{position:fixed;right:22px;bottom:92px;width:62px;height:62px;border:0;border-radius:50%;background:var(--g);color:white;font-size:34px;box-shadow:0 8px 22px #45604b55;cursor:pointer}.box{width:min(620px,100%);margin:auto;background:var(--card);padding:20px;border-radius:20px}.bottomnav{position:fixed;left:0;right:0;bottom:0;height:76px;background:#fffdf7;border-top:1px solid #e2e5dc;display:grid;grid-template-columns:1fr 1fr;z-index:20;box-shadow:0 -6px 20px #526b5712}.bottomnav button{border:0;background:transparent;font-size:17px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center}.bottomnav button.active{color:var(--g);background:#f0f4ec}.bottomnav .ico{font-size:24px}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;font-weight:600}.field input,.field textarea{width:100%;padding:11px;border:1px solid #d8d9d1;border-radius:10px;background:white}.actions{display:flex;justify-content:flex-end;gap:8px}.actions button{border:0;padding:10px 15px;border-radius:10px}.primary{background:var(--g);color:white}.nav{display:flex;gap:8px;margin-bottom:14px}.nav button.active{background:var(--g);color:#fff}.hidden{display:none}.record{padding:12px 0;border-bottom:1px solid #ebe8df}.record img{max-width:130px;border-radius:10px;margin-top:8px}@media(max-width:560px){.day{min-height:45px;font-size:14px}}
</style></head><body><header><h1>🌱 種菜小幫手</h1><div class='sub' id='today'></div></header><main class='wrap'><section id='home' class='grid'><div class='card'><h2>🌿 作物倒數日</h2><div id='countdowns'></div></div><div class='card'><div class='calhead'><button onclick='moveMonth(-1)'>‹</button><h2 id='monthTitle'></h2><button onclick='moveMonth(1)'>›</button></div><div class='week'><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class='calendar' id='calendar'></div><div id='daily'>請點選日期查看紀錄 🌱</div></div></section><section id='add' class='hidden'><form class='box' id='form'><h2>＋ 新增種植紀錄</h2><div class='field'><label>作物名稱 *</label><input id='crop' required></div><div class='field'><label>目標日期 *</label><input id='target' type='date' required></div><div class='field'><label><input id='water' type='checkbox'> 提醒澆水</label></div><div class='field'><label>備註（選填）</label><textarea id='note' rows='3'></textarea></div><div class='field'><label>圖片（選填）</label><input id='photo' type='file' accept='image/*'></div><div class='actions'><button type='button' onclick="showPage('home')">取消</button><button class='primary'>儲存</button></div></form></section><section id='search' class='hidden'><div class='card'><h2>🔎 查詢紀錄</h2><input id='q' placeholder='搜尋作物名稱' oninput='renderSearch()' style='width:100%;padding:11px;border:1px solid #ddd;border-radius:10px'><div class='tabs' style='margin-top:10px'><button id='activeBtn' class='active' onclick="searchMode='active';renderSearch()">進行中</button><button id='endedBtn' onclick="searchMode='ended';renderSearch()">已結束</button></div><div id='results'></div></div></section></main><button class='fab' id='fab' onclick="showPage('add')">＋</button><nav class='bottomnav'><button id='navHome' class='active' onclick="showPage('home')"><span class='ico'>🏠</span><span>首頁</span></button><button id='navSearch' onclick="showPage('search')"><span class='ico'>🔎</span><span>查詢</span></button></nav><script>
const key='plantHelperRecords';let records=JSON.parse(localStorage.getItem(key)||'[]'),view=new Date(),selected=null,searchMode='active';const pad=n=>String(n).padStart(2,'0');const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const day0=s=>new Date(s+'T00:00:00');const diff=s=>Math.ceil((day0(s)-new Date(new Date().toDateString()))/86400000);function save(){localStorage.setItem(key,JSON.stringify(records))}function init(){let d=new Date();today.textContent=`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日・星期${'日一二三四五六'[d.getDay()]}`;render()}function render(){renderCountdown();renderCal();renderSearch()}function renderCountdown(){let a=records.filter(r=>diff(r.target)>=0).sort((a,b)=>diff(a.target)-diff(b.target));countdowns.innerHTML=a.length?a.map(r=>`<div class='crop'><div><b>🌱 ${esc(r.crop)}</b><div class='sub'>目標日期：${r.target}${r.water?' · 💧 澆水提醒':''}</div></div><span class='badge'>${diff(r.target)===0?'今天':diff(r.target)+' 天後'}</span></div>`).join(''):'目前沒有進行中的作物 🌱'}function renderCal(){let y=view.getFullYear(),m=view.getMonth();monthTitle.textContent=`${y} 年 ${m+1} 月`;let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),h='';for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=days;d++){let s=`${y}-${pad(m+1)}-${pad(d)}`,has=records.some(r=>r.target===s);h+=`<div class='day ${selected===s?'sel':''}' onclick="selectDay('${s}')">${d}${has?'<span class=dot></span>':''}</div>`}calendar.innerHTML=h;if(selected)showDaily()}function moveMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);selected=null;daily.textContent='請點選日期查看紀錄 🌱';renderCal()}function selectDay(s){selected=s;renderCal()}function showDaily(){let a=records.filter(r=>r.target===selected);daily.innerHTML=`<b>📅 ${selected} 當日紀錄</b>`+(a.length?a.map(r=>card(r)).join(''):'<div class=sub style="margin-top:8px">這天沒有種植紀錄 🌱</div>')}function card(r){return `<div class=record><b>🌱 ${esc(r.crop)}</b><div>目標日期：${r.target}｜${diff(r.target)>=0?'剩餘 '+diff(r.target)+' 天':'已結束'}</div><div>${r.water?'💧 澆水提醒：開啟':'💧 澆水提醒：關閉'}</div>${r.note?`<div>備註：${esc(r.note)}</div>`:''}${r.photo?`<img src='${r.photo}'>`:''}</div>`}function renderSearch(){if(!results)return;activeBtn.classList.toggle('active',searchMode==='active');endedBtn.classList.toggle('active',searchMode==='ended');let term=(q.value||'').toLowerCase(),a=records.filter(r=>(searchMode==='active'?diff(r.target)>=0:diff(r.target)<0)&&r.crop.toLowerCase().includes(term));results.innerHTML=a.length?a.sort((a,b)=>a.target.localeCompare(b.target)).map(card).join(''):'<p class=sub>沒有符合的紀錄。</p>'}function showPage(id){home.classList.toggle('hidden',id!=='home');search.classList.toggle('hidden',id!=='search');add.classList.toggle('hidden',id!=='add');navHome.classList.toggle('active',id==='home'||id==='add');navSearch.classList.toggle('active',id==='search');fab.classList.toggle('hidden',id!=='home');if(id==='search')renderSearch();window.scrollTo({top:0,behavior:'smooth'})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}form.onsubmit=e=>{e.preventDefault();let f=photo.files[0];let add=p=>{records.push({id:Date.now(),crop:crop.value.trim(),target:target.value,water:water.checked,note:note.value.trim(),photo:p||''});save();form.reset();render();showPage('home')};if(f){let rd=new FileReader();rd.onload=()=>add(rd.result);rd.readAsDataURL(f)}else add('')};init();
</script></body></html>
